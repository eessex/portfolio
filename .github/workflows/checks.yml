name: Checks

# Typecheck, lint and tests. Vercel's build only migrates and builds.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level filter: a skipped `checks` still satisfies a required check,
  # which workflow-level paths-ignore wouldn't
  changes:
    if: github.repository == 'eessex/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # PRs read changed files from the API; pushes need the git history
      - if: github.event_name == 'push'
        uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'

  checks:
    needs: changes
    # Only on the source repo, so forks' synced pushes cost them nothing.
    # A failed filter runs the checks rather than skipping them.
    if: >-
      !cancelled() &&
      github.repository == 'eessex/portfolio' &&
      (needs.changes.result != 'success' ||
        needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:quiet
